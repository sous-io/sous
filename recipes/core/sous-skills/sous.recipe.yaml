# core/sous-skills
#
# SPECIAL: this recipe's source of truth stays inside the sous npm package, where
# it seeds the machine-wide store on first run so a fresh, offline setup works.
# The release pipeline pushes a copy here, versioned to match the sous
# application version. That copy is machine-written distribution output.
#
# Because it is the offline seed, this recipe declares NO dependencies. Nothing
# it ships may point at a recipe that has to be fetched.
formatVersion: 1

namespace: core
name: sous-skills
version: 0.2.1

description: >-
  The skills that teach an agent what sous is and how it works: which files sous
  owns and must never be hand-edited, how a sous configuration is written and
  debugged, the .tpl. template convention and LiquidJS syntax, what an agent
  skill is, and how to create one.

contents:
  - kind: skills
    include:
      - skills/**/*

variables:
  - name: skillsRoot
    env: SKILLS_ROOT
    type: path
    prompt: Where should this project's own skills be kept?
    description: >-
      This recipe teaches agents to write skills of their own, and a skill's
      source is not the compiled copy sous builds into the agent directories.
      This setting says where those sources are kept: the create-skill skill
      writes new skills there, and the about-sous and about-agent-skills skills
      point agents at it when they go looking. The default keeps them in a
      prompts directory at the project root, but any path works, either relative
      to the project root or absolute.
    example: prompts/skills
    default: prompts/skills
    required: true
    scope: shared
    validate:
      minLength: 1
