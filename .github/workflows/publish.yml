name: Publish to npm

# Publishing a version = pushing a v* tag (`git tag v0.1.2 && git push origin
# v0.1.2`). Creating a GitHub Release with a NEW tag also works (that creates
# and pushes the tag); a Release on an existing tag re-publishes nothing.
on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    # Trusted publishing requires a GitHub-hosted runner.
    runs-on: ubuntu-latest
    permissions:
      # Lets the job mint the OIDC token that npm exchanges for publish access.
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm >= 11.5.1; the bundled npm can lag.
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm test
      - run: npm publish
