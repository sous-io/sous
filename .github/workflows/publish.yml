name: Publish to npm

on:
  release:
    types: [published]

jobs:
  publish:
    # Trusted publishing requires a GitHub-hosted runner.
    runs-on: ubuntu-latest
    permissions:
      # Lets the job mint the OIDC token that npm exchanges for publish access.
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm >= 11.5.1; the bundled npm can lag.
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm test
      - run: npm publish
