<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Sous documentation: an agent configuration manager for LLM coding tools.">
  <meta name="theme-color" content="#51b13e">
  <title>Sous Documentation</title>
  <script>
    /* Apply any saved theme before first paint to avoid a flash */
    (function () {
      var theme = localStorage.getItem("sous-theme");
      if (theme === "light" || theme === "dark") {
        document.documentElement.setAttribute("data-sous-theme", theme);
      }
    })();
  </script>
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/chrome.css">
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/gh/termynal/termynal.py@v0.14.0/termynal/assets/termynal.css">
  <link rel="stylesheet" href="../css/docs.css">
</head>
<body>
  <a class="repo-link pres-link" href="../" aria-label="Watch the Sous introduction">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="12" cy="12" r="10"/>
      <polygon points="10 8 16 12 10 16 10 8"/>
    </svg>
  </a>

  <button type="button" class="theme-toggle" id="themeToggle" aria-label="Toggle color theme">
    <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
    </svg>
    <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="12" cy="12" r="5"/>
      <line x1="12" y1="1" x2="12" y2="3"/>
      <line x1="12" y1="21" x2="12" y2="23"/>
      <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
      <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
      <line x1="1" y1="12" x2="3" y2="12"/>
      <line x1="21" y1="12" x2="23" y2="12"/>
      <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
      <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
    </svg>
  </button>

  <a class="repo-link" href="https://github.com/sous-io/sous" target="_blank" rel="noopener"
     aria-label="Sous on GitHub">
    <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
      <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/>
    </svg>
  </a>

  <a class="repo-link npm-link" href="https://www.npmjs.com/package/@sous-io/sous" target="_blank"
     rel="noopener" aria-label="Sous on npm">
    <span class="npm-mark">npm</span>
  </a>

  <div id="app">Loading the docs...</div>
  <noscript>
    <p style="padding: 2rem;">
      These docs render in the browser and need JavaScript. The same content lives as plain
      markdown at
      <a href="https://github.com/sous-io/sous/tree/main/docs/docs">github.com/sous-io/sous</a>.
    </p>
  </noscript>

  <script>
    window.$docsify = {
      name: "Sous",
      nameLink: "#/",
      loadSidebar: true,
      subMaxLevel: 2,
      auto2top: true,
      executeScript: true,
      search: {
        placeholder: "Search the docs",
        noData: "No results.",
        depth: 3
      },
      pagination: {
        crossChapter: true,
        crossChapterText: false
      }
    };
  </script>
  <script src="../js/term-demos.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4.13.1/lib/docsify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4.13.1/lib/plugins/search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code@3.0.0/dist/docsify-copy-code.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-pagination@2.10.1/dist/docsify-pagination.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/termynal/termynal.py@v0.14.0/termynal/assets/termynal.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.30.0/components/prism-bash.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.30.0/components/prism-json.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.30.0/components/prism-yaml.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.30.0/components/prism-typescript.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.30.0/components/prism-markdown.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.30.0/components/prism-markup-templating.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.30.0/components/prism-liquid.min.js"></script>
  <script>
    document.getElementById("themeToggle").addEventListener("click", function () {
      var html = document.documentElement;
      var current = html.getAttribute("data-sous-theme");
      if (current !== "light" && current !== "dark") {
        current = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      }
      var next = current === "dark" ? "light" : "dark";
      html.setAttribute("data-sous-theme", next);
      localStorage.setItem("sous-theme", next);
    });
  </script>
</body>
</html>
