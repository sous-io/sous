<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Sous — an agent configuration manager for LLM coding tools. Coming soon.">
  <meta name="theme-color" content="#51b13e">
  <title>Sous — Coming Soon</title>
  <link rel="stylesheet" href="css/main.css">
  <style>
    /* Page-specific layout for the Coming Soon splash; theme comes from main.css */
    html, body {
      height: 100%;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: var(--sous-space-l);
    }

    main {
      max-width: 34rem;
      animation: rise 0.9s ease-out both;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .mark {
      font-family: var(--sous-font-family-monospace);
      font-size: var(--sous-font-size-base);
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: var(--sous-primary);
      margin-bottom: var(--sous-space-l);
    }

    h1 {
      font-size: clamp(var(--sous-h1), 8vw, var(--sous-font-size-xxl));
      letter-spacing: -0.02em;
      margin-bottom: var(--sous-space-m);
    }

    h1 .cursor {
      display: inline-block;
      width: 0.08em;
      margin-left: 0.06em;
      background: var(--sous-primary);
      animation: blink 1.1s steps(1) infinite;
    }

    @keyframes blink {
      50% { opacity: 0; }
    }

    .tagline {
      font-size: var(--sous-font-size-l);
      color: var(--sous-body-text-muted);
      margin-bottom: var(--sous-space-l);
    }

    .tagline strong {
      color: var(--sous-body-text);
    }

    .prompt {
      display: inline-flex;
      align-items: center;
      gap: 0.6em;
      font-family: var(--sous-font-family-monospace);
      padding: var(--sous-space-s) var(--sous-space-m);
    }

    .prompt .dollar {
      color: var(--sous-primary);
      user-select: none;
    }

    footer {
      margin-top: var(--sous-space-xl);
      font-size: var(--sous-font-size-s);
      color: var(--sous-body-text-muted);
    }

    @media (prefers-reduced-motion: reduce) {
      main { animation: none; }
      h1 .cursor { animation: none; }
    }
  </style>
</head>
<body>
  <main>
    <p class="mark">Sous</p>
    <h1>Coming&nbsp;soon<span class="cursor">&nbsp;</span></h1>
    <p class="tagline">
      Your agent configuration <strong>sous&#8209;chef</strong> — compile prompts, skills,
      and context for LLM coding agents from one set of sources, with everything
      prepped exactly where each tool expects it.
    </p>
    <p class="prompt tile"><span class="dollar">$</span>xcv build</p>
    <footer>
      In the meantime, find us on <a href="https://github.com/sous-io/sous">GitHub</a>.
    </footer>
  </main>
</body>
</html>
